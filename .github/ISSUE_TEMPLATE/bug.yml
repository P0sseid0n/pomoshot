name: Reportar bug
description: Algo não está funcionando como deveria
labels: ['bug']
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Envie 3 capturas na tela de upload
        2. Clique em "importar aulas"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: Onde?
      options:
        - frontend (interface)
        - backend (API / IA)
        - não sei
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 141, Windows 11
  - type: textarea
    id: extras
    attributes:
      label: Prints, logs ou mensagens de erro
      description: Cole a mensagem de erro do console ou do terminal, se houver. Não envie suas chaves de API.
